<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Theme before first paint (no flash). Mirrors model resolveTheme + LocalStorageRepo 'prefs' key — keep in sync.
      // Store takes over after init (main.jsx).
      (function () {
        var theme = null;
        try { theme = JSON.parse(localStorage.getItem('prefs') || 'null').theme; } catch (e) {}
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
